: "うんどうじょうを　おもいっきり　はしりまわる"}, {"h": "はしった", "k": "", "s": "ろうかを　はしったら　おおけがに　なるかも"}, {"h": "がんばった", "k": "", "s": "ぴかぴかに　なるまで　そうじを　がんばった"}, {"h": "ちからいっぱい", "k": "ゴール", "s": "ごおるまで　ちからいっぱい　はしりぬけた"}];
const VW=p=>{for(const[v,l]of[['あ','あかがさざただなはばぱまやゃらわぁ'],['い','いきぎしじちぢにひびぴみりぃ'],['う','うくぐすずつづぬふぶぷむゆゅるぅ'],['え','えけげせぜてでねへべぺめれぇ'],['お','おこごそぞとどのほぼぽもよょろをぉ']])if(l.includes(p))return v;return'ー'};

const KRE=new RegExp(Object.keys(KD).sort((a,b)=>b.length-a.length).join('|'),'g');
const RANKS=[[0,'ひよっこ','🐣'],[300,'みならい','🌱'],[600,'いちにんまえ','⭐'],[900,'たつじん','🏅'],[1200,'めいじん','👑']];
const S={mode:'time',kata:0,ul:1,lh:0},$=id=>document.getElementById(id),sum=a=>a.reduce((x,y)=>x+y,0);

function start(){document.body.classList.toggle('lh',!!S.lh);score=0;combo=0;solved=0;deck=[];busy=false;running=true;show('game');
 const T=S.mode==='time';['barw','tm','sc'].forEach(i=>$(i).style.display=T?'':'none');$('sc').textContent='0てん';$('bar').style.width='100%';

function tick(){const r=60-(performance.now()-t0)/1000;$('bar').style.width=Math.max(0,r/.6)+'%';$('tm').textContent=Math.ceil(Math.max(r,0));if(r<=0)finish()}
function finish(){clearInterval(timer);running=false;let r=RANKS[0];RANKS.forEach(x=>{if(score>=x[0])r=x});$('rs').textContent=score;$('rk').textContent=r[2]+' '+r[1];$('rn').textContent=solved+'もん せいかい';show('res')}
const XW=['つかまった','おわった'];
function build(r,kata){
 const s=r.s.replace(/[。\s　]+$/,'');let a=s.indexOf(r.h),b=a+r.h.length,m;const segs=[];
 if(kata){KRE.lastIndex=0;while((m=KRE.exec(s))){if(m.index===0||/[ 　「]/.test(s[m.index-1]))segs.push({o:m.index,e:m.index+m[0].length,t:KD[m[0]]});else KRE.lastIndex=m.index+1}}
 segs.forEach(g=>{if(g.o<b&&g.e>a){a=Math.min(a,g.o);b=Math.max(b,g.e)}});
 const R=[[a,b]];XW.forEach(w=>{const k=s.indexOf(w);if(k>=0)R.push([k,k+w.length])});const inR=(o,e)=>R.some(x=>o<x[1]&&e>x[0]);
 const bs=[],need=[];let n=0,cur=[],pos=0,txt='';
 const put=(c,u)=>{if(c===' '||c==='　'){if(cur.length)bs.push(cur);cur=[];return}txt+=c;if(c==='っ'||c==='ッ')need.push({i:n,c,u});else cur.push({c,i:n++,u})};
 while(pos<s.length){const g=segs.find(x=>x.o===pos);if(g){const u=inR(g.o,g.e);for(const c of g.t)put(c,u);pos=g.e}else{put(s[pos],inR(pos,pos+1));pos++}}

function next(){

function layout(){

function tray(){const t=$('tray');t.innerHTML='';for(const x of Q.rc){const c=document.createElement('div');c.className='card';c.textContent=x;c.dataset.c=x;c.onpointerdown=e=>grab(e,c);t.appendChild(c)}}
function gaps(){const out=[],els=[...$('sent').querySelectorAll('.ch:not(.pl)')],f=Q.f;
 els.forEach((e,k)=>{const nx=els[k+1];if(!nx)return;const i=+e.dataset.i+1;if(Q.placed[i])return;
  const a=e.getBoundingClientRect(),b=nx.getBoundingClientRect(),x=(a.left+a.right)/2;
  if(Math.abs(a.left-b.left)<f/2)out.push({i,x,y:(a.bottom+b.top)/2});else{out.push({i,x,y:a.bottom});out.push({i,x:(b.left+b.right)/2,y:b.top})}});return out}
function grab(e,c){if(drag||!running||busy)return;e.preventDefault();c.setPointerCapture(e.pointerId);c.classList.add('lift');
 const fl=$('fl'),ins=$('ins');fl.className='card';fl.textContent=c.textContent;fl.style.display='flex';drag={G:gaps(),g:null};
 const mv=ev=>{const L=S.lh?ev.clientX+28:ev.clientX-138,tx=S.lh?L+110:L,ty=ev.clientY;fl.style.transform='translate('+L+'px,'+(ty-42)+'px)';
  let b=null,bd=1e9;for(const g of drag.G){const d=Math.hypot(g.x-tx,g.y-ty);if(d<bd){bd=d;b=g}}
  drag.g=bd<Math.max(80,Q.f*1.6)?b:null;
  if(drag.g){ins.style.display='block';ins.style.left=drag.g.x-Q.f*.65+'px';ins.style.width=Q.f*1.3+'px';ins.style.top=drag.g.y-3+'px'}else ins.style.display='none'};
 const up=ev=>{c.onpointermove=c.onpointerup=c.onpointercancel=null;fl.style.display='none';ins.style.display='none';c.classList.remove('lift');const g=ev.type==='pointerup'?drag.g:null;drag=null;if(g)place(g.i,c.dataset.c)};
 c.onpointermove=mv;c.onpointerup=up;c.onpointercancel=up;mv(e)}
function place(i,x){if(!running||busy||Q.placed[i])return;
 if(Q.need.includes(i)&&Q.nc[i]===x){Q.placed[i]=1;Q.rem--;Q.rc.splice(Q.rc.indexOf(x),1);render();tray();Q.rem?fbShow('ok','○','',600):done()}
 else{Q.miss++;fbShow('ng','ちがうよ','',1000)}}
function fbShow(cls,t,sub,ms){const f=$('fb');f.className='on '+cls;f.innerHTML='<div>'+t+'</div>'+(sub?'<small>'+sub+'</small>':'');clearTimeout(fbT);fbT=setTimeout(()=>f.className='',ms)}
function done(){const T=S.mode==='time',t=(performance.now()-Q.t)/1000;let pts=0;
 if(T){const sp=Math.max(0,Math.min(100,Math.round((12-t)*10)));
  if(Q.miss){pts=70+Math.round(sp/2);combo=0}else{combo++;pts=100+sp+Math.min(50,(combo-1)*10)}
  score+=pts;$('sc').textContent=score+'てん'}
 solved++;busy=true;fbShow('ok','○',T?'+'+pts:'',T?850:1600);if(!T)speak(Q.text);
 setTimeout(()=>{if(running)next()},T?900:1700)}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
$('spk').onclick=()=>Q&&speak(Q.text);
$('skip').onclick=()=>{if(!busy&&running){combo=0;next()}};
$('quit').onclick=()=>{clearInterval(timer);running=false;try{speechSynthesis.cancel()}catch(e){}show('start')};
$('b1').onclick=()=>{S.mode='free';start()};$('b2').onclick=()=>{S.mode='time';start()};$('again').onclick=start;
$('ttl').innerHTML=['ちいさな「っ」は','どこでしょう？'].map(x=>[...x].map((c,i)=>'<span'+(c==='っ'?' class="q"':'')+' style="animation-delay:'+i*.12+'s">'+c+'</span>').join('')).join('<br>');$('home').onclick=()=>show('start');
addEventListener('resize',()=>{if(running&&Q){layout();render()}});
</script></body></html>
